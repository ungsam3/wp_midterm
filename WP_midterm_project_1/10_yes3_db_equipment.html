        <article>
            <div class="sub_article">
                <h1>비품</h1>
            </div>
            <div class="wrap">
      <!-- 비품 (캔바 p.11) -->
                <section class="panel" id="panel-supplies" >
                    <div class="panel-title"><p>모든 비품은 <mark>5개씩</mark> 있습니다. <strong>분실하지 않게</strong> 조심하세요.</p></div>
                <section class="supply-group">
                    <h3><button type="button" class="group-btn">공구함 A</button> <span class="count">3 ITEMS</span></h3>
                    <ul class="supply-grid">
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/screwdriver.svg" alt="스크류드라이버" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">드라이버</div>
                        <input class="cnt" type="number" id="수량-스크류드라이버" name="cnt-screwdriver" min="0" max="5" step="1" value="5">
                    </li>
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/nipper.svg" alt="니퍼" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">니퍼</div>
                        <input class="cnt" type="number" id="수량-니퍼" name="cnt-nipper" min="0" max="5" step="1" value="5">
                    </li>
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/tape-measure.svg" alt="줄자" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">줄자</div>
                        <input class="cnt" type="number" id="수량-줄자" name="cnt-measure" min="0" max="5" step="1" value="5">
                    </li>
                    
        
                    </ul>
                </section>

                <section class="supply-group">
                    <h3><button type="button" class="group-btn">아두이노</button> <span class="count">3 ITEMS</span></h3>
                    <ul class="supply-grid">
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/arduino.svg" alt="아두이노 우노" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">아두이노 우노</div>
                        <input class="cnt" type="number" id="수량-아두이노" name="cnt-arduino" min="0" max="5" step="1" value="5">
                    </li>
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/breadboard (1).svg" alt="브래드보드 수량" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">브레드보드</div>
                        <input class="cnt" type="number" id="수량-브레드보드" name="cnt-breadboard" min="0" max="5" step="1" value="5">
                    </li>
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/jumper-wire (1).svg" alt="" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">점퍼선 (묶음)</div>
                        <input class="cnt" type="number" id="점퍼-와이어" name="cnt-jumper-wire" min="0" max="5" step="1" value="5">
                    </li>
                    </ul>
                </section>

                <section class="supply-group">
                    <h3><button type="button" class="group-btn">소모품</button> <span class="count">3 ITEMS</span></h3>
                    <ul class="supply-grid">
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/led.svg" alt="LED 봉지" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">LED (봉지)</div>
                        <input class="cnt" type="number" id="led봉지" name="cnt-led" min="0" max="5" step="1" value="5">
                    </li>
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/resistor.svg" alt="저항키트" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">저항 키트</div>
                        <input class="cnt" type="number" id="저항키트" name="cnt-resistor" min="0" max="5" step="1" value="5">
                        
                    </li>
                
                    
                    <li class="supply-item">
                        <div class="thumb"><img src="./item/cable-tie.svg" alt="케이블타이" loading="lazy"><span class="badge">부족</span></div>
                        <div class="name">케이블타이 (봉지)</div>
                        <input class="cnt" type="number" id="케이블타이" name="cnt-cable-tie" min="0" max="5" step="1" value="5">
                    
                    </li>
                    
                    </ul>
                </section>
